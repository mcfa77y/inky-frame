# SonarQube project configuration
sonar.projectKey=inky-frame
sonar.projectName=Inky Frame
sonar.projectVersion=0.1.0

# Source configuration
sonar.sources=.
sonar.inclusions=apps/**,core/**,models/**,services/**,utils/**,scripts/**,main.py,watch_and_upload.py
sonar.exclusions=typings/**,sd/**,lib/**,docs/**,secrets.py,**/__pycache__/**,.*/**

# Encoding & Language
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11

# Coverage exclusions (static analysis only)
sonar.coverage.exclusions=**/*

# Server Configuration
sonar.host.url=http://localhost:9000
