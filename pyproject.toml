[project]
name = "inky-frame"
version = "0.1.0"
description = "MicroPython applications and framework for Pimoroni Inky Frame"
requires-python = ">=3.11"
dependencies = [
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".git",
    ".venv*",
    "typings",
    "lib",
    "build",
    ".ruff_cache",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
]
ignore = [
    "E501",
]
